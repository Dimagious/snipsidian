name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, typecheck, unit tests with the coverage gate, the scanner, the release check, the build with its
  # Node-only check, and the bundle artifact (snipsidian-bundle). coverage-artifact keeps the report for the
  # Codecov job below (snipsidian-coverage).
  kit:
    uses: Dimagious/obsidian-plugin-dev-kit/.github/workflows/plugin-ci.yml@c39084b24154360fe9879fe480d7a8edfbc37d5d # v0.3.0
    with:
      coverage-artifact: true

  # Only Snipsy checks this. It reads the repository's files and needs no install.
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Project site (broken images, dead anchors, dashes, required files)
        run: npm run site:check

  coverage:
    needs: kit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snipsidian-coverage
          path: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          verbose: true
