name: release
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # The kit's release workflow runs no tests, and `opdk release` does not either: this job is what stops a tag
  # with failing unit tests from producing a release.
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  release:
    needs: test
    # The kit's workflow builds in a job with a read-only token, attests main.js, manifest.json and styles.css, and
    # makes a draft release with the CHANGELOG section as notes. `opdk release` verifies the draft and publishes it.
    uses: Dimagious/obsidian-plugin-dev-kit/.github/workflows/release.yml@32a1860033a8e07f6718d568434c6d116a5d1de7 # v0.2.0
