<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-labelledby="snipsy-banner-title">
  <title id="snipsy-banner-title">Snipsy: type a trigger and a space, get the text. Typing note and a space becomes a Note callout.</title>
  <defs>
    <clipPath id="callout-clip-light"><rect x="696" y="44" width="172" height="72" rx="6"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="159" rx="20" fill="#ffffff" stroke="#e3e3e3"/>
  <g transform="translate(32,32) scale(3)">
    <rect x="2" y="2" width="28" height="28" rx="7" fill="#0b8466"/>
    <rect x="7" y="8" width="8" height="3" rx="1.5" fill="#ffffff" fill-opacity=".6"/>
    <path d="M18.5 7l3 2.5-3 2.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="7" y="15" width="18" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="7" y="21" width="10" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="19.5" y="19.5" width="2" height="6" rx="1" fill="#ffffff"/>
  </g>
  <g transform="translate(152,78.5)">
    <text x="0" y="0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <tspan font-weight="700" font-size="36" fill="#222222">Snipsy</tspan><tspan dx="12" font-size="15" fill="#8e8e8e" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace">snipsidian</tspan>
    </text>
    <text x="0" y="32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#5c5c5c">Type a trigger and a space. Get the text.</text>
  </g>
  <!-- before: the trigger in a key chip, with a visible space -->
  <g>
    <rect x="524" y="61" width="94" height="39" rx="7" fill="#d0d0d0"/>
    <rect x="525" y="62" width="92" height="36" rx="6" fill="#f6f6f6"/>
    <text x="540" y="86" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="19" fill="#222222">note</text>
    <path d="M591 79.5v4.5h12v-4.5" fill="none" stroke="#8e8e8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- arrow, drawn like the chevron in the mark -->
  <path d="M634 80h40M666 72l8 8-8 8" fill="none" stroke="#0b8466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- after: a rendered [!note] callout, caret on the body line -->
  <g clip-path="url(#callout-clip-light)">
    <rect x="696" y="44" width="172" height="72" fill="rgb(8,109,221)" fill-opacity="0.09"/>
    <rect x="696" y="44" width="3" height="72" fill="rgb(8,109,221)"/>
  </g>
  <g fill="none" stroke="rgb(8,109,221)" stroke-width="2" stroke-linecap="round" transform="translate(713,56) scale(0.6667)">
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
  </g>
  <text x="737" y="69.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(8,109,221)">Note</text>
  <rect x="714" y="84" width="2" height="19" rx="1" fill="#0b8466"/>
</svg>
