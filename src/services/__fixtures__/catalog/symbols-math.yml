name: "Symbols & Math"
version: "1.1.0"
author: "snipsidian-community"
license: "MIT"
description: "Arrows, math operators, Greek letters, currency. Type the name, get the symbol — without opening a character map."
category: "symbols"
tags: ["symbols", "math", "unicode", "greek"]

snippets:
  # Arrows
  - trigger: "arr"
    replace: "→"
  - trigger: "arrl"
    replace: "←"
  - trigger: "arru"
    replace: "↑"
  - trigger: "arrd"
    replace: "↓"
  - trigger: "darr"
    replace: "⇒"
  - trigger: "darrl"
    replace: "⇐"
  - trigger: "lrarr"
    replace: "↔"
  - trigger: "udarr"
    replace: "↕"

  # Math operators
  - trigger: "plusmn"
    replace: "±"
  - trigger: "xmul"
    replace: "×"
  - trigger: "divv"
    replace: "÷"
  - trigger: "neq"
    replace: "≠"
  - trigger: "leq"
    replace: "≤"
  - trigger: "geq"
    replace: "≥"
  - trigger: "apprx"
    replace: "≈"
  - trigger: "equiv"
    replace: "≡"
  - trigger: "summ"
    replace: "∑"
  - trigger: "prodd"
    replace: "∏"
  - trigger: "intg"
    replace: "∫"
  - trigger: "sqrtt"
    replace: "√"
  - trigger: "inff"
    replace: "∞"
  - trigger: "prtl"
    replace: "∂"
  - trigger: "nabla"
    replace: "∇"
  - trigger: "degr"
    replace: "°"

  # Greek letters (lowercase, commonly used in science)
  - trigger: "alphaa"
    replace: "α"
  - trigger: "betaa"
    replace: "β"
  - trigger: "gammaa"
    replace: "γ"
  - trigger: "deltaa"
    replace: "δ"
  - trigger: "epsi"
    replace: "ε"
  - trigger: "thetaa"
    replace: "θ"
  - trigger: "lambdaa"
    replace: "λ"
  - trigger: "mui"
    replace: "μ"
  - trigger: "pii"
    replace: "π"
  - trigger: "sigmaa"
    replace: "σ"
  - trigger: "phii"
    replace: "φ"
  - trigger: "omegaa"
    replace: "ω"

  # Logic / set
  - trigger: "andd"
    replace: "∧"
  - trigger: "orr"
    replace: "∨"
  - trigger: "nott"
    replace: "¬"
  - trigger: "forall"
    replace: "∀"
  - trigger: "exst"
    replace: "∃"
  - trigger: "elemof"
    replace: "∈"
  - trigger: "notelem"
    replace: "∉"
  - trigger: "emptyset"
    replace: "∅"

  # Currency
  - trigger: "eur"
    replace: "€"
  - trigger: "gbp"
    replace: "£"
  - trigger: "yenn"
    replace: "¥"
  - trigger: "rubb"
    replace: "₽"

  # Punctuation
  - trigger: "mdash"
    replace: "—"
  - trigger: "ndash"
    replace: "–"
  - trigger: "ellp"
    replace: "…"
  - trigger: "lquot"
    replace: "“"
  - trigger: "rquot"
    replace: "”"
